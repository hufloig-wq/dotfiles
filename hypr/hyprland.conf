#windowrule = size 900 600, match:class org.gnome.Nautilus
#windowrule = center on, match:class org.gnome.Nautilus

# Pavucontrol flotante
windowrule = float on, match:class pavucontrol
windowrule = size 700 500, match:class pavucontrol
windowrule = center on, match:class pavucontrol

# Wofi flotante
windowrule = float on, match:class wofi
windowrule = center on, match:class wofi

# Waypaper flotante
windowrule = float on, match:class waypaper
windowrule = center on, match:class waypaper
