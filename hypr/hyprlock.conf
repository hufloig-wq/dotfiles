# ──────────────────────────────────────────────────────────── 
#  Hyprlock — wallpaper blur + clock + password field
# ────────────────────────────────────────────────────────────

general {
    disable_loading_bar = true
    no_fade_in = false
    grace = 0
    hide_cursor = true
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 5, smooth
}

# Wallpaper con blur
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    brightness = 0.8
    contrast = 1.0
    vibrancy = 0.2
}

# Hora grande centrada
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(205, 214, 244, 1.0)
    font_size = 90
    font_family = ZedMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
}

# Fecha debajo de la hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = rgba(205, 214, 244, 0.8)
    font_size = 22
    font_family = ZedMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Campo de password
input-field {
    monitor =
    size = 400, 60
    position = 0, -100
    halign = center
    valign = center

    inner_color = rgba(26, 27, 38, 0.8)
    outer_color = rgba(122, 162, 247, 1.0)
    outline_thickness = 3

    font_family = ZedMono Nerd Font
    font_size = 18
    font_color = rgba(205, 214, 244, 1.0)

    placeholder_color = rgba(205, 214, 244, 0.5)
    placeholder_text = 󰌾  Contraseña
    check_color = rgba(158, 206, 106, 1.0)
    fail_color = rgba(247, 118, 142, 1.0)
    fail_text = 󰅙  Contraseña incorrecta

    rounding = 12
    shadow_passes = 2
    shadow_size = 4
    fade_on_empty = false
    dots_size = 0.3
    dots_spacing = 0.2
}
